media:
  input: public/images
  output: /images

content:
  - name: homepage
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - name: slides
        label: Homepage carousel slides
        type: object
        list: true
        fields:
          - name: eyebrow
            label: Small heading
            type: string
          - name: title
            label: Main heading
            type: string
          - name: image
            label: Slide image
            type: image
      - name: newsletterTitle
        label: Newsletter title
        type: string
      - name: newsletterText
        label: Newsletter text
        type: text
      - name: newsletterUrl
        label: Newsletter link
        type: string
      - name: recapTitle
        label: Recap title
        type: string
      - name: recapText
        label: Recap text
        type: text
      - name: aboutText
        label: About Penn KDSAP
        type: text
      - name: contactText
        label: Contact prompt
        type: string
